<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Pie Generator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <article class="card">
      <header class="top">
        <h1 class="name" id="name"></h1>
        <p class="sub" id="sub"></p>
      </header>

      <p class="status" id="status"></p>

      <section class="block">
        <h2>The sums</h2>
        <p class="line" id="size-line"></p>
        <p class="line" id="cost-line"></p>
        <p class="line" id="crust-line"></p>
        <p class="line" id="topping-line"></p>
        <p class="line budget" id="budget-line"></p>

        <p class="total">
          <span>Total cost</span>
          <strong id="total"></strong>
        </p>
        <p class="fine-print" id="fine-print"></p>
      </section>

      <section class="block steps-wrap">
        <h2>Method</h2>
        <ul class="steps" id="steps"></ul>
        <p class="tagline" id="tagline"></p>
      </section>
    </article>

    <script>

      const crusts = [
        'all-butter shortcrust',
        'graham cracker crust',
        'lard crust',
        'chocolate cookie crust',
        'oat and almond crust',
      ]

      const fillings = [
        'Sour cherry',
        'Brown butter apple',
        'Pumpkin',
        'Key lime',
        'Blueberry lemon',
        'Pecan',
        'Peach and ginger',
        'Chocolate silk',
      ]

      const toppings = [
        'a lattice top',
        'whipped cream',
        'toasted meringue',
        'a crumble topping',
      ]

      const bakers = ['Nan Wei', 'Big Dot', 'The Corner Oven']

      const accents = ['#b3263e', '#2f6f4e', '#3b4c9c', '#a8541f', '#6b3f7a', '#1f7a8c']

      const taglines = [
        'Best served warm, with something cold.',
        'Rest it for an hour. Really.',
        'Nobody ever regretted a second slice.',
        'Blind bake the crust first.',
        'Leftovers are breakfast.',
        'Cut it with a hot knife.',
        'Sugar is cheaper than regret.',
      ]



     
      function pickRandom(list) {
        const index = Math.floor(Math.random() * list.length)
        return list[index]
      }


      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min
      }


     
      const crust = pickRandom(crusts)
      const filling = pickRandom(fillings)
      const topping = pickRandom(toppings)

      const pieInches = randomBetween(8, 12)
      const guests = randomBetween(4, 16)
      const prepMinutes = randomBetween(15, 60)
      const bakeMinutes = randomBetween(25, 75)
      const budget = randomBetween(40, 150)

      const costPerInch = randomBetween(5, 10) / 10
      const crustCost = randomBetween(2, 4) + 0.5
      const toppingCost = randomBetween(1, 3) + 0.75


  
      const slicesPerPie = pieInches >= 10 ? 10 : 8

      // Math.ceil: 12 guests on 8-slice pies still means 2 pies
      const piesNeeded = Math.ceil(guests / slicesPerPie)

      const costPerPie = pieInches * costPerInch + crustCost + toppingCost
      const totalCost = costPerPie * piesNeeded
      const costPerPerson = totalCost / guests
      const budgetUsed = Math.round((totalCost / budget) * 100)
      const totalMinutes = prepMinutes + bakeMinutes
      const hoursPart = Math.floor(totalMinutes / 60)
      const minutesPart = totalMinutes % 60

      // booleans worked out from comparisons, never typed
      const isOverBudget = totalCost > budget
      const isLongBake = totalMinutes > 100

      const gap = Math.abs(budget - totalCost)


      let status

      if (isLongBake) {
        status = 'Long bake: start first thing in the morning'
      } else if (totalMinutes > 70) {
        status = 'An afternoon project'
      } else {
        status = 'Quick one: ready before dinner'
      }

   
      const budgetLine = isOverBudget
        ? `Over budget by $${gap.toFixed(2)}`
        : `Under budget by $${gap.toFixed(2)}`

      const pieWord = piesNeeded === 1 ? 'pie' : 'pies'

      // template literal with lots of variables
      const sub = `${piesNeeded} ${pieWord} at ${pieInches} inches, for ${guests} guests, ready in ${hoursPart}h ${minutesPart}m`

      const finePrint = `$${costPerPerson.toFixed(2)} per person · ${budgetUsed}% of your $${budget} budget · ${slicesPerPie} slices per pie`



      const steps = [
        `Make the ${crust} and chill it`,
        `Mix the ${filling.toLowerCase()} filling`,
        `Bake for ${bakeMinutes} minutes`,
        `Finish with ${topping}`,
      ]

      let stepsHTML = ''

      for (let i = 0; i < steps.length; i++) {
        // i % 2: every other row gets a stripe
        const stripe = i % 2 === 0 ? 'stripe' : ''

        // i % 3: every third row (the 3rd) is the oven step
        const isOvenStep = i % 3 === 2
        const label = isOvenStep ? `<span class="oven">oven</span>` : ''

        stepsHTML += `<li class="${stripe}"><span class="num">${i + 1}</span>${steps[i]}${label}</li>`
      }


      
      document.querySelector('#name').textContent = `${filling} pie`
      document.querySelector('#sub').textContent = sub
      document.querySelector('#status').textContent = status

      document.querySelector('#size-line').textContent =
        `${piesNeeded} × ${pieInches}" pie`
      document.querySelector('#cost-line').textContent =
        `Filling: ${pieInches}" × $${costPerInch.toFixed(2)}  —  $${(pieInches * costPerInch).toFixed(2)}`
      document.querySelector('#crust-line').textContent =
        `Crust  —  $${crustCost.toFixed(2)}`
      document.querySelector('#topping-line').textContent =
        `Topping  —  $${toppingCost.toFixed(2)}`
      document.querySelector('#budget-line').textContent = budgetLine
      document.querySelector('#budget-line').classList.toggle('over', isOverBudget)

      document.querySelector('#total').textContent = `$${totalCost.toFixed(2)}`
      document.querySelector('#fine-print').textContent = finePrint
      document.querySelector('#tagline').textContent = pickRandom(taglines)
      document.querySelector('#steps').innerHTML = stepsHTML

      document.body.style.setProperty('--accent', pickRandom(accents))

      console.log({ filling, crust, topping, totalCost, totalMinutes, isOverBudget, isLongBake })
    </script>
  </body>
</html>
