<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Pie Generator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <article class="card">
      <header class="top">
        <p class="kicker" id="kicker"></p>
        <h1 class="name" id="name"></h1>
        <p class="sub" id="sub"></p>
      </header>

      <p class="status" id="status"></p>

      <section class="block">
        <h2>The sums</h2>
        <p class="line" id="size-line"></p>
        <p class="line" id="cost-line"></p>
        <p class="line" id="crust-line"></p>
        <p class="line" id="topping-line"></p>
        <p class="line budget" id="budget-line"></p>

        <p class="total">
          <span>Total cost</span>
          <strong id="total"></strong>
        </p>
        <p class="fine-print" id="fine-print"></p>
      </section>

     
      <section class="block">
        <h2>Details</h2>
        <ul id="details"></ul>
      </section>

      <section class="controls">
        <div class="qty">
          <span class="qty-label">Guests</span>
          <button id="minus" type="button" aria-label="One fewer guest">−</button>
          <span class="count" id="count"></span>
          <button id="plus" type="button" aria-label="One more guest">+</button>
        </div>

        <div class="field">
          <label for="who">Who is it for?</label>
          <input id="who" type="text" placeholder="Type a name" />
        </div>

        <button class="roll" id="roll" type="button">Bake a different pie</button>
        <!-- NEW (Part B) -->
        <button class="roll" id="clear" type="button">Clear saved pie</button>
      </section>

      <section class="block steps-wrap">
        <h2>Method</h2>
        <ul class="steps" id="steps"></ul>
        <p class="tagline" id="tagline"></p>
      </section>
    </article>

    <script>
      /*
        PART B ANSWER :

        When the saved pie comes back from local storage, its DATA is all there
        (filling, prepMinutes, the serveWith array, the details object) but its
        methods are gone. Calling savedPie.totalMinutes() throws
        "totalMinutes is not a function". That is because JSON only stores data,
        and JSON.stringify silently drops functions.

        To fix it, I would not trust the parsed copy: I look the pie up again in
        my pies array by its filling name, so I get the original object with its
        methods back (see loadSavedPie below).
      */

      /* ---------- DATA ---------- */

     
      const pies = [
        {
          filling: 'Sour cherry',
          crust: 'all-butter shortcrust',
          topping: 'a lattice top',
          pieInches: 9,
          costPerInch: 0.9,
          crustCost: 3.5,
          toppingCost: 2.75,
          prepMinutes: 45,
          bakeMinutes: 65,
          budget: 40,
          tagline: 'Rest it for an hour. Really.',
          accent: '#b3263e',
          isVegetarian: true,
          serveWith: ['vanilla ice cream', 'whipped cream'],
          details: {
            'Oven temp': '200°C / 400°F',
            Difficulty: 'Medium',
            'Keeps for': '2 days',
          },

          totalMinutes() {
            return this.prepMinutes + this.bakeMinutes
          },
          costPerPie() {
            return this.pieInches * this.costPerInch + this.crustCost + this.toppingCost
          },
        },
        {
          filling: 'Brown butter apple',
          crust: 'lard crust',
          topping: 'a crumble topping',
          pieInches: 10,
          costPerInch: 0.7,
          crustCost: 2.5,
          toppingCost: 1.75,
          prepMinutes: 30,
          bakeMinutes: 50,
          budget: 30,
          tagline: 'Best served warm, with something cold.',
          accent: '#a8541f',
          isVegetarian: false,
          serveWith: ['cheddar', 'cinnamon ice cream'],
          details: {
            'Oven temp': '190°C / 375°F',
            Difficulty: 'Easy',
            'Keeps for': '3 days',
          },

          totalMinutes() {
            return this.prepMinutes + this.bakeMinutes
          },
          costPerPie() {
            return this.pieInches * this.costPerInch + this.crustCost + this.toppingCost
          },
        },
        {
          filling: 'Pumpkin',
          crust: 'graham cracker crust',
          topping: 'whipped cream',
          pieInches: 9,
          costPerInch: 0.6,
          crustCost: 2.5,
          toppingCost: 1.75,
          prepMinutes: 25,
          bakeMinutes: 40,
          budget: 20,
          tagline: 'Leftovers are breakfast.',
          accent: '#6b3f7a',
          isVegetarian: true,
          serveWith: ['hot coffee', 'maple syrup'],
          details: {
            'Oven temp': '175°C / 350°F',
            Difficulty: 'Easy',
            'Keeps for': '4 days',
            'Chill time': '4 hours',
          },

          totalMinutes() {
            return this.prepMinutes + this.bakeMinutes
          },
          costPerPie() {
            return this.pieInches * this.costPerInch + this.crustCost + this.toppingCost
          },
        },
        {
          filling: 'Key lime',
          crust: 'graham cracker crust',
          topping: 'toasted meringue',
          pieInches: 8,
          costPerInch: 1,
          crustCost: 2.5,
          toppingCost: 2.75,
          prepMinutes: 20,
          bakeMinutes: 15,
          budget: 25,
          tagline: 'Cut it with a hot knife.',
          accent: '#2f6f4e',
          isVegetarian: true,
          serveWith: ['fresh lime zest'],
          details: {
            'Oven temp': '175°C / 350°F',
            Difficulty: 'Medium',
            'Keeps for': '2 days',
            'Chill time': '6 hours',
          },

          totalMinutes() {
            return this.prepMinutes + this.bakeMinutes
          },
          costPerPie() {
            return this.pieInches * this.costPerInch + this.crustCost + this.toppingCost
          },
        },
        {
          filling: 'Chocolate silk',
          crust: 'chocolate cookie crust',
          topping: 'whipped cream',
          pieInches: 11,
          costPerInch: 0.8,
          crustCost: 3.5,
          toppingCost: 1.75,
          prepMinutes: 40,
          bakeMinutes: 70,
          budget: 45,
          tagline: 'Nobody ever regretted a second slice.',
          accent: '#3b4c9c',
          isVegetarian: true,
          serveWith: ['raspberries', 'espresso'],
          details: {
            'Oven temp': '160°C / 325°F',
            Difficulty: 'Hard',
            'Keeps for': '3 days',
          },

          totalMinutes() {
            return this.prepMinutes + this.bakeMinutes
          },
          costPerPie() {
            return this.pieInches * this.costPerInch + this.crustCost + this.toppingCost
          },
        },
      ]

      

      function pickRandom(list) {
        const index = Math.floor(Math.random() * list.length)
        return list[index]
      }

    
      let currentPie

      let guests = 6
      let eaterName = ''

      const MIN_GUESTS = 1
      const MAX_GUESTS = 20
      const STORAGE_KEY = 'savedPie'

    

      function rollNewPie() {
        currentPie = pickRandom(pies)
      }

      function savePie() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPie))
      }

     
      function loadSavedPie() {
        const raw = localStorage.getItem(STORAGE_KEY)

        if (!raw) {
          return false
        }

        try {
          const saved = JSON.parse(raw)

         
          const original = pies.find(function (pie) {
            return pie.filling === saved.filling
          })

          if (original) {
            currentPie = original
            return true
          }
        } catch (error) {
          
        }

        return false
      }

  

      function render() {
        const slicesPerPie = currentPie.pieInches >= 10 ? 10 : 8

        const piesNeeded = Math.ceil(guests / slicesPerPie)

        const fillingCost = currentPie.pieInches * currentPie.costPerInch
        const costPerPie = currentPie.costPerPie() // method
        const totalCost = costPerPie * piesNeeded
        const costPerPerson = totalCost / guests
        const budgetUsed = Math.round((totalCost / currentPie.budget) * 100)
        const totalMinutes = currentPie.totalMinutes() // method
        const hoursPart = Math.floor(totalMinutes / 60)
        const minutesPart = totalMinutes % 60

        const isOverBudget = totalCost > currentPie.budget
        const isLongBake = totalMinutes > 100

        const gap = Math.abs(currentPie.budget - totalCost)

        let status

        if (isLongBake) {
          status = 'Long bake: start first thing in the morning'
        } else if (totalMinutes > 70) {
          status = 'An afternoon project'
        } else {
          status = 'Quick one: ready before dinner'
        }

        const budgetLine = isOverBudget
          ? `Over budget by $${gap.toFixed(2)}`
          : `Under budget by $${gap.toFixed(2)}`

        const pieWord = piesNeeded === 1 ? 'pie' : 'pies'
        const kicker = eaterName === '' ? '' : `Made for ${eaterName}`
        const diet = currentPie.isVegetarian ? 'vegetarian' : 'not vegetarian'

        const sub = `${piesNeeded} ${pieWord} at ${currentPie.pieInches} inches, for ${guests} guests, ready in ${hoursPart}h ${minutesPart}m`

        const finePrint = `$${costPerPerson.toFixed(2)} per person · ${budgetUsed}% of your $${currentPie.budget} budget · ${slicesPerPie} slices per pie · ${diet}`

   
        const steps = [
          `Make the ${currentPie.crust} and chill it`,
          `Mix the ${currentPie.filling.toLowerCase()} filling`,
          `Bake for ${currentPie.bakeMinutes} minutes`,
          `Finish with ${currentPie.topping}`,
          `Serve with ${currentPie.serveWith.join(' or ')}`,
        ]

        let stepsHTML = ''

        for (let i = 0; i < steps.length; i++) {
          const stripe = i % 2 === 0 ? 'stripe' : ''
          const isOvenStep = i % 3 === 2
          const label = isOvenStep ? `<span class="oven">oven</span>` : ''

          stepsHTML += `<li class="${stripe}"><span class="num">${i + 1}</span>${steps[i]}${label}</li>`
        }

        
        const detailKeys = Object.keys(currentPie.details)
        let detailsHTML = ''

        for (let i = 0; i < detailKeys.length; i++) {
          const key = detailKeys[i]
          detailsHTML += `<li><strong>${key}:</strong> ${currentPie.details[key]}</li>`
        }

        
        document.querySelector('#kicker').textContent = kicker
        document.querySelector('#name').textContent = `${currentPie.filling} pie`
        document.querySelector('#sub').textContent = sub
        document.querySelector('#status').textContent = status

        document.querySelector('#size-line').textContent =
          `${piesNeeded} × ${currentPie.pieInches}" ${pieWord}`
        document.querySelector('#cost-line').textContent =
          `Filling: ${currentPie.pieInches}" × $${currentPie.costPerInch.toFixed(2)}  —  $${fillingCost.toFixed(2)}`
        document.querySelector('#crust-line').textContent =
          `Crust  —  $${currentPie.crustCost.toFixed(2)}`
        document.querySelector('#topping-line').textContent =
          `Topping  —  $${currentPie.toppingCost.toFixed(2)}`
        document.querySelector('#budget-line').textContent = budgetLine
        document.querySelector('#budget-line').classList.toggle('over', isOverBudget)

        document.querySelector('#total').textContent = `$${totalCost.toFixed(2)}`
        document.querySelector('#fine-print').textContent = finePrint
        document.querySelector('#count').textContent = guests
        document.querySelector('#steps').innerHTML = stepsHTML
        document.querySelector('#details').innerHTML = detailsHTML
        document.querySelector('#tagline').textContent = currentPie.tagline

        document.body.style.setProperty('--accent', currentPie.accent)

        document.querySelector('#minus').disabled = guests === MIN_GUESTS
        document.querySelector('#plus').disabled = guests === MAX_GUESTS
      }

      
      function handlePlus() {
        if (guests < MAX_GUESTS) {
          guests = guests + 1
          render()
        }
      }

      function handleMinus() {
        if (guests > MIN_GUESTS) {
          guests = guests - 1
          render()
        }
      }

      function handleName(event) {
        eaterName = event.target.value.trim()
        render()
      }

      function handleRoll() {
        rollNewPie()
        savePie()
        render()
      }

      function handleClear() {
        localStorage.removeItem(STORAGE_KEY)
        rollNewPie()
        render()
      }

      document.querySelector('#plus').addEventListener('click', handlePlus)
      document.querySelector('#minus').addEventListener('click', handleMinus)
      document.querySelector('#who').addEventListener('input', handleName)
      document.querySelector('#roll').addEventListener('click', handleRoll)
      document.querySelector('#clear').addEventListener('click', handleClear)

  
      if (!loadSavedPie()) {
        rollNewPie()
      }

      render()
    </script>
  </body>
</html>
